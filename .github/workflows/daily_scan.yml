name: SMA and Fronius Monitor Daily Scan
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: document-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Test Fronius monitor
        run: python -m unittest discover -s tests -v
      - name: Run SMA scraper
        id: sma
        continue-on-error: true
        run: python scraper.py
      - name: Run Fronius scraper
        id: fronius
        continue-on-error: true
        run: python fronius_scraper.py
      - name: Commit and push scan results
        if: ${{ !cancelled() && steps.fronius.outcome != 'skipped' }}
        run: |
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add sma_daten.json history.json fronius_daten.json fronius_history.json fronius_status.json
          if ! git diff --staged --quiet; then
            git commit -m "Update SMA und Fronius Monitor Daten"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Report scan failures
        if: ${{ !cancelled() && (steps.sma.outcome == 'failure' || steps.fronius.outcome == 'failure') }}
        run: exit 1
